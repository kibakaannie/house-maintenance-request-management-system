{% extends "base.html" %}

{% block title %}Reassign Technician | Admin{% endblock %}

{% block content %}
<div class="dashboard">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <h3><i class="fas fa-sync-alt"></i> Reassign Technician</h3>
        <p><strong>Request #{{ request.id }}:</strong> {{ request.title }}</p>
        <p><strong>Current Technician:</strong> {{ current_tech.name if current_tech else 'Unassigned' }}</p>
        
        <form method="POST">
            <div class="form-group">
                <label>Select New Technician</label>
                <select name="technician_id" class="form-control" required>
                    {% for tech in technicians %}
                    <option value="{{ tech.id }}">
                        {{ tech.name }} - {{ tech.specialty }} ({{ tech.status|capitalize }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="d-flex" style="gap: 16px;">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-check"></i> Confirm Reassignment
                </button>
                <a href="{{ url_for('admin.maintenance') }}" class="btn btn-outline-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
