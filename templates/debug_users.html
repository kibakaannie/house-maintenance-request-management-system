{% extends "base.html" %}
{% block title %}Registered Users{% endblock %}
{% block content %}
<h1>Registered Users</h1>
<table border="1" cellpadding="10">
    <tr>
        <th>Email</th>
        <th>Name</th>
        <th>Role</th>
    </tr>
    {% for user in users %}
    <tr>
        <td>{{ user.email }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.role }}</td>
    </tr>
    {% endfor %}
</table>
<a href="/admin/dashboard">Back</a>
{% endblock %}
